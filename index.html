<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optics Color Tokens</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@rolemodel/optics@latest/dist/css/optics.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css" />

    <style>
      :root {
        /**
        * Adjust these...
        **/
        --op-color-primary-h: 214;
        --op-color-primary-s: 91%;
        --op-color-primary-l: 57%;

        --op-color-secondary-h: 283;
        --op-color-secondary-s: 49%;
        --op-color-secondary-l: 19%;

        --op-color-tertiary-h: 193;
        --op-color-tertiary-s: 69%;
        --op-color-tertiary-l: 72%;

        --op-color-academy-primary-h: 157;
        --op-color-academy-primary-s: 100%;
        --op-color-academy-primary-l: 36%;

        --op-color-academy-secondary-h: 222;
        --op-color-academy-secondary-s: 49%;
        --op-color-academy-secondary-l: 48%;

        --op-color-academy-accent-h: 149;
        --op-color-academy-accent-s: 47%;
        --op-color-academy-accent-l: 50%;

        --op-color-neutral-h: var(--op-color-primary-h);
        --op-color-neutral-s: 0%;
        --op-color-neutral-l: 80%;

        --op-color-alerts-warning-h: 38;
        --op-color-alerts-warning-s: 100%;
        --op-color-alerts-warning-l: 73%;

        --op-color-alerts-danger-h: 0;
        --op-color-alerts-danger-s: 99%;
        --op-color-alerts-danger-l: 76%;

        --op-color-alerts-info-h: 189;
        --op-color-alerts-info-s: 88%;
        --op-color-alerts-info-l: 78%;

        --op-color-alerts-notice-h: 107;
        --op-color-alerts-notice-s: 43%;
        --op-color-alerts-notice-l: 62%;
      }
    </style>
  </head>

  <body>
    <h1>Optics Design System - Color Tokens Grid</h1>

    <!-- Primary   -->

    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Primary</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-primary-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-primary-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="primary-grid">
        <!-- Primary colors will be inserted here -->
      </div>
    </div>
    

    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Secondary</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-secondary-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-secondary-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="secondary-grid">
        <!-- Neutral colors will be inserted here -->
      </div>
    </div>

    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Tertiary</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-tertiary-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-tertiary-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="tertiary-grid">
        <!-- Tertiary colors will be inserted here -->
      </div>
    </div>

    <!-- Neutral   -->
    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Neutral</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-neutral-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-neutral-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="neutral-grid">
        <!-- Neutral colors will be inserted here -->
      </div>
    </div>

    <!-- Warning   -->
    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Warning</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-alerts-warning-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-alerts-warning-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="warning-grid">
        <!-- Warning colors will be inserted here -->
      </div>
    </div>

    <!-- Danger   -->
    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Danger</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-alerts-danger-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-alerts-danger-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="danger-grid">
        <!-- Danger colors will be inserted here -->
      </div>
    </div>

    <!-- Info   -->
    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Info</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-alerts-info-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-alerts-info-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="info-grid">
        <!-- Info colors will be inserted here -->
      </div>
    </div>

    <!-- Notice   -->
    <div class="hsl-controls">
      <div class="hsl-row">
        <h3>Notice</h3>
        <div class="hsl-group">
          <label>H</label>
          <input id="hsl-alerts-notice-h" type="number" min="0" max="360" />
        </div>
        <div class="hsl-group">
          <label>S</label>
          <input id="hsl-alerts-notice-s" type="number" min="0" max="100" />
        </div>
      </div>
    </div>
    <div class="color-scale-section">
      <div class="color-grid" id="notice-grid">
        <!-- Notice colors will be inserted here -->
      </div>
    </div>

    <!-- Generated Color Variables Section -->
    <div class="variables-section">
      <h2>Generated Color Variables</h2>
      <p>
        Copy these variables to use in your CSS. They update automatically when
        you change the H, S, L values above.
      </p>
      <div class="variables-container">
        <button class="copy-button" onclick="copyVariables()">
          Copy All Variables
        </button>
        <button
          class="copy-button"
          onclick="generateAndDownloadJSON()"
          style="right: 160px"
        >
          Download JSON
        </button>
        <button
          class="copy-button"
          onclick="previewJSON()"
          style="right: 320px"
        >
          Preview JSON
        </button>
        <pre id="color-variables-output" class="variables-output">
Generating variables...</pre
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/a11y-contrast-color@1.1.0/dist/a11y-contrast-color.min.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
